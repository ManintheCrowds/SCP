[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scp-mcp"
version = "0.1.7"
description = "Secure Contain Protect — inspect, sanitize, contain, quarantine content for LLM safety"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest"]
# Antigen P0 (SCP-ANT1): stronger schnorr + schema validation. Both are OPTIONAL —
# antigen.py falls back to a bundled pure-Python BIP-340 impl and manual validation
# when these are absent, so a bare install still passes the antigen test suite.
antigen = ["coincurve>=18.0.0", "jsonschema>=4.0.0"]
antigen-nostr = ["websocket-client>=1.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scp = ["schemas/*.json", "scp_threat_registry.json"]

[tool.pytest.ini_options]
markers = [
    "l402_integration: live regtest L402 fetch (requires SCP_ANTIGEN_L402_INTEGRATION + token)",
]
