title = "Gitleaks configuration"

# An allowlist-only file does not load built-in rules, so gitleaks reports
# nothing. Extend the default ruleset. Path regexes are anchored so a
# substring of an allowlisted name cannot hide another file.
[extend]
useDefault = true

[allowlist]
description = "Binaries, lockfiles, and bytecode caches."
paths = [
  '''(^|/)[^/]+\.lock$''',
  '''(^|/)[^/]+\.svg$''',
  '''(^|/)[^/]+\.png$''',
  '''(^|/)[^/]+\.jpg$''',
  '''(^|/)[^/]+\.jpeg$''',
  '''(^|/)[^/]+\.gif$''',
  '''(^|/)[^/]+\.pdf$''',
  '''(^|/)[^/]+\.min\.js$''',
  '''(^|/)[^/]+\.map$''',
  '''(^|/)__pycache__(/|$)''',
  '''(^|/)[^/]+\.pyc$''',
]
