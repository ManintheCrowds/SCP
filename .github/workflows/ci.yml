# PURPOSE: Run OpenHarness MCP contract conformance and the sanitizer regression tests.
# Branch protection requires a check context named exactly "CI" (not the workflow name).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: MCP contract and sanitizer tests
        run: >
          pytest
          tests/test_mcp_contract_v1.py
          tests/test_tool_poisoning.py
          tests/test_sanitize_encoding_evasion.py
          tests/test_sanitize_fragmentation.py
          tests/test_security_regressions.py
          -q
          -m "not slow"

  slow-sanitizer:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Full-size sanitizer timing tests
        env:
          SCP_THREAT_REGISTRY_PATH: src/scp/scp_threat_registry.json
        run: pytest tests/test_tool_poisoning.py -m slow -q

  promptfoo-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/promptfoo/package-lock.json
      - name: Install SCP (editable)
        run: pip install -e ".[dev]"
      - name: Install promptfoo (examples/promptfoo)
        working-directory: examples/promptfoo
        run: npm ci
      - name: promptfoo eval (SCP tier probes, no API keys)
        working-directory: examples/promptfoo
        run: npx promptfoo eval -c promptfooconfig.yaml

  # Required status context for main branch protection. Must keep this job id as CI.
  CI:
    needs: [contract, promptfoo-eval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream jobs
        run: |
          echo "contract=${{ needs.contract.result }} promptfoo-eval=${{ needs.promptfoo-eval.result }}"
          if [ "${{ needs.contract.result }}" != "success" ] || [ "${{ needs.promptfoo-eval.result }}" != "success" ]; then
            exit 1
          fi
