# PURPOSE: Run OpenHarness MCP contract conformance (tool names vs scp_mcp_v1).
# Branch protection requires a check context named exactly "CI" (not the workflow name).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: MCP contract v1 (pytest)
        run: pytest tests/test_mcp_contract_v1.py -v

  promptfoo-eval:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/promptfoo/package-lock.json
      - name: Install SCP (editable)
        run: pip install -e ".[dev]"
      - name: Install promptfoo (examples/promptfoo)
        working-directory: examples/promptfoo
        run: npm ci
      - name: promptfoo eval (SCP tier probes, no API keys)
        working-directory: examples/promptfoo
        run: npx promptfoo eval -c promptfooconfig.yaml

  tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default checkout is a depth-1 synthetic merge. Its hash
          # changes every run, so history scans must see the real head.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev deps
        run: python3 -m pip install -e ".[dev]"
      - name: Run unit tests
        env:
          SCP_GITLEAKS_HISTORY: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m pytest tests \
            --ignore=tests/test_setup_mycelium_nostr_key.py \
            --ignore=tests/test_contract_document_hash.py \
            -q --tb=line

  # The checker script is the base revision's file. There is no fallback that
  # runs this pull request's copy. Until main contains scripts/run_mask_check.py,
  # a pull request fails closed. That one-time gap is documented on the PR.
  mask-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pinned-masker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the base masker when that revision has a checker
        if: github.event_name == 'pull_request'
        run: |
          if [ -f pinned-masker/scripts/run_mask_check.py ]; then
            python3 -m pip install ./pinned-masker
          fi
      - name: Install the pushed masker
        if: github.event_name != 'pull_request'
        run: python3 -m pip install ./head
      - name: Run the base mask checker
        working-directory: head
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_DIR: ${{ github.workspace }}/pinned-masker
          SCP_MASK_CHECK_ROOT: ${{ github.workspace }}/head
        run: |
          set -euo pipefail
          # A pull request must not put its own tree on the import path.
          unset PYTHONPATH
          export PYTHONSAFEPATH=1
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            checker="${BASE_DIR}/scripts/run_mask_check.py"
            if [ ! -f "$checker" ]; then
              echo "base revision has no mask checker; failing closed" >&2
              exit 1
            fi
            python3 "$checker"
            exit $?
          fi
          if [ ! -f scripts/run_mask_check.py ]; then
            echo "mask checker missing; failing closed" >&2
            exit 1
          fi
          python3 scripts/run_mask_check.py

  # Required status context for main branch protection. Must keep this job id as CI.
  CI:
    timeout-minutes: 5
    needs: [contract, promptfoo-eval, tests, mask-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream jobs
        run: |
          echo "contract=${{ needs.contract.result }} promptfoo-eval=${{ needs.promptfoo-eval.result }} tests=${{ needs.tests.result }} mask-check=${{ needs.mask-check.result }}"
          contract="${{ needs.contract.result }}"
          promptfoo="${{ needs.promptfoo-eval.result }}"
          tests="${{ needs.tests.result }}"
          mask="${{ needs.mask-check.result }}"
          # skipped is not success. A skipped mask-check must fail the gate.
          if [ "$contract" != "success" ] || [ "$promptfoo" != "success" ] || [ "$tests" != "success" ] || [ "$mask" != "success" ]; then
            exit 1
          fi
