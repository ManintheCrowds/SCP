name: Secret Scan (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gitleaks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # marshal.load of bytecode is version-specific. 3.13 is the version
      # that consumes every historical bytecode blob on main exactly.
      - name: Pin the bytecode parser
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select the base gitleaks config
        id: gitleaks-config
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
              echo "base revision has no gitleaks config; failing closed" >&2
              exit 1
            fi
            git show "${BASE_SHA}:.gitleaks.toml" > "${RUNNER_TEMP}/gitleaks.base.toml"
            echo "path=${RUNNER_TEMP}/gitleaks.base.toml" >> "${GITHUB_OUTPUT}"
          else
            if [ ! -f .gitleaks.toml ]; then
              echo "gitleaks config missing; failing closed" >&2
              exit 1
            fi
            echo "path=.gitleaks.toml" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ${{ steps.gitleaks-config.outputs.path }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      # gitleaks 8.30.1 reads ./.gitleaksignore from the scanned worktree even
      # when --gitleaks-ignore-path is set. Check out a worktree, delete that
      # file, and scan the copy with the base ignore file only.
      # This step does not repeat the full base..head range scan.
      - name: Scan with the base ignore file
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_CONFIG: ${{ steps.gitleaks-config.outputs.path }}
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          expected_version="8.30.1"
          expected_sha="88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
          if [ "${GITLEAKS_VERSION}" != "${expected_version}" ]; then
            echo "refusing GITLEAKS_VERSION=${GITLEAKS_VERSION}" >&2
            exit 1
          fi
          bin="$(command -v gitleaks)"
          # Hash the file before executing it. A cached binary must not run
          # in order to report its version.
          actual_sha="$(sha256sum "${bin}" | awk '{print $1}')"
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "refusing gitleaks binary digest" >&2
            exit 1
          fi
          actual_version="$("${bin}" version | tr -d '[:space:]')"
          if [ "${actual_version}" != "${expected_version}" ]; then
            echo "refusing gitleaks version ${actual_version}" >&2
            exit 1
          fi
          dest="${RUNNER_TEMP}/gitleaks.base.ignore"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}:.gitleaksignore" 2>/dev/null; then
              git show "${BASE_SHA}:.gitleaksignore" > "$dest"
            else
              : > "$dest"
            fi
          elif [ -f .gitleaksignore ]; then
            cp .gitleaksignore "$dest"
          else
            : > "$dest"
          fi
          scan="${RUNNER_TEMP}/gitleaks-worktree"
          rm -rf "${scan}"
          git worktree add --detach "${scan}" HEAD
          cleanup() {
            git worktree remove --force "${scan}" >/dev/null 2>&1 || rm -rf "${scan}"
          }
          trap cleanup EXIT
          rm -f "${scan}/.gitleaksignore"
          # git's attributes and binary detection hide patches. The log options
          # force a text diff and show a merge commit's own changes, without
          # walking refs other than the history of this checkout.
          # Blob exemptions come from the base revision, not from this pull request.
          blob_allow="${RUNNER_TEMP}/gitleaks.blob-allow"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}:scripts/gitleaks_blob_allow.txt" 2>/dev/null; then
              git show "${BASE_SHA}:scripts/gitleaks_blob_allow.txt" > "${blob_allow}"
            else
              : > "${blob_allow}"
            fi
          elif [ -f scripts/gitleaks_blob_allow.txt ]; then
            cp scripts/gitleaks_blob_allow.txt "${blob_allow}"
          else
            : > "${blob_allow}"
          fi
          # Isolated from the checkout: a root subprocess.py, os.py, or json.py
          # must not run inside the step that holds the trusted config.
          (
          cd "${RUNNER_TEMP}"
          PYTHONSAFEPATH=1 python3 -I - "${scan}" "${blob_allow}" << 'PY'
          import io
          import json
          import marshal
          import os
          import subprocess
          import sys
          import types
          from pathlib import Path

          if not hasattr(os, "environ") or not hasattr(json, "dumps") or not hasattr(subprocess, "run"):
              sys.stderr.write("refusing shadowed interpreter modules\n")
              sys.exit(1)

          root = Path(sys.argv[1])
          allowed_blobs = set()
          allow_path = Path(sys.argv[2])
          if allow_path.is_file():
              for raw in allow_path.read_text(encoding="utf-8").splitlines():
                  item = raw.strip()
                  if item and not item.startswith("#"):
                      allowed_blobs.add(item)
          # Content signatures. The file name is not an exemption.
          _MAGICS = (
              b"\x89PNG\r\n\x1a\n",
              b"\xff\xd8\xff",
              b"GIF87a",
              b"GIF89a",
              b"%PDF-",
              b"\x7fELF",
              b"PK\x03\x04",
              b"\x1f\x8b",
          )

          def known_binary(data: bytes) -> bool:
              if any(data.startswith(magic) for magic in _MAGICS):
                  return True
              return len(data) >= 4 and data[1:4] == b"\r\r\n"

          # String and tuple fields are ordinary text. The three byte fields are
          # the interpreter's own tables, so only a long UTF-16 run is a plant.
          _CODE_TEXT = (
              "co_consts",
              "co_names",
              "co_varnames",
              "co_freevars",
              "co_cellvars",
              "co_filename",
              "co_name",
              "co_qualname",
          )
          _CODE_BINARY = ("co_code", "co_linetable", "co_exceptiontable")

          def _utf16_pairs(data: bytes, need: int = 16) -> bool:
              """Printable text interleaved with NUL bytes, in either byte order."""

              def scan(start: int) -> bool:
                  little = 0
                  big = 0
                  index = start
                  last = len(data) - 1
                  while index < last:
                      first = data[index]
                      second = data[index + 1]
                      if second == 0 and 32 <= first <= 126:
                          little += 1
                          if little >= need:
                              return True
                      else:
                          little = 0
                      if first == 0 and 32 <= second <= 126:
                          big += 1
                          if big >= need:
                              return True
                      else:
                          big = 0
                      index += 2
                  return False

              return bool(data) and (scan(0) or scan(1))

          def _payload_hides_secret(obj: object, seen: set[int]) -> bool:
              marker = id(obj)
              if marker in seen:
                  return False
              seen.add(marker)
              if isinstance(obj, types.CodeType):
                  if any(_payload_hides_secret(getattr(obj, name), seen) for name in _CODE_TEXT):
                      return True
                  return any(_utf16_pairs(getattr(obj, name)) for name in _CODE_BINARY)
              if isinstance(obj, (bytes, bytearray)):
                  raw = bytes(obj)
                  return utf16_text(raw) or ascii_after_nul(raw)
              if isinstance(obj, str):
                  try:
                      utf8 = obj.encode("utf-8", "surrogateescape")
                  except UnicodeEncodeError:
                      return True
                  try:
                      latin = obj.encode("latin-1")
                  except UnicodeEncodeError:
                      latin = b""
                  return (
                      utf16_text(utf8)
                      or ascii_after_nul(utf8)
                      or utf16_text(latin)
                      or ascii_after_nul(latin)
                  )
              if isinstance(obj, dict):
                  return any(_payload_hides_secret(item, seen) for item in obj) or any(
                      _payload_hides_secret(item, seen) for item in obj.values()
                  )
              if isinstance(obj, (tuple, list, set, frozenset)):
                  return any(_payload_hides_secret(item, seen) for item in obj)
              return False

          def _load_marshal(payload: bytes) -> tuple[str, object]:
              buffer = io.BytesIO(payload)
              try:
                  obj = marshal.load(buffer)
              except Exception:
                  return "error", None
              if buffer.tell() != len(payload):
                  return "partial", obj
              return "ok", obj

          def cpython_bytecode(data: bytes, name: str) -> bool:
              """A .pyc whose marshal value is exactly one code object.

              Every string field is scanned, including nested code objects.
              Bytes and strings are checked as UTF-16 and as text hidden by
              NUL bytes. The code and line tables are checked for a long
              UTF-16 run.
              Any other marshal error refuses the blob. A non-.pyc name is
              never exempt.
              """
              if not name.endswith(".pyc") or len(data) < 16 or data[1:4] != b"\r\r\n":
                  return False
              flags = int.from_bytes(data[4:8], "little")
              if flags not in (0, 1):
                  return False
              status, obj = _load_marshal(data[16:])
              if status == "error":
                  sys.stderr.write(f"refusing unreadable bytecode: {name}\n")
                  sys.exit(1)
              if status != "ok" or not isinstance(obj, types.CodeType):
                  return False
              if _payload_hides_secret(obj, set()):
                  return False
              return True

          def utf16_text(data: bytes) -> bool:
              if data.startswith(b"\xff\xfe") or data.startswith(b"\xfe\xff"):
                  return True
              # A run of printable bytes interleaved with NULs. A fixed window
              # misses a short secret sitting between non-zero neighbors.
              return _utf16_pairs(data, 8)

          def ascii_after_nul(data: bytes) -> bool:
              start = data.find(b"\x00")
              if start < 0:
                  return False
              run = 0
              for byte in data[start + 1 :]:
                  if 48 <= byte <= 57 or 65 <= byte <= 90 or 97 <= byte <= 122:
                      run += 1
                      if run >= 20:
                          return True
                  else:
                      run = 0
              return False

          listed = subprocess.run(
              ["git", "rev-list", "--objects", "HEAD"],
              cwd=root,
              capture_output=True,
          )
          if listed.returncode != 0:
              sys.stderr.write("refusing to scan: git object list failed\n")
              sys.exit(1)
          for line in listed.stdout.splitlines():
              if b" " not in line:
                  continue
              oid, _, path = line.partition(b" ")
              kind = subprocess.run(
                  ["git", "cat-file", "-t", oid],
                  cwd=root,
                  capture_output=True,
              ).stdout.strip()
              if kind != b"blob":
                  continue
              if oid.decode("ascii") in allowed_blobs:
                  continue
              data = subprocess.run(
                  ["git", "cat-file", "blob", oid],
                  cwd=root,
                  capture_output=True,
              ).stdout
              name = path.decode("utf-8", "replace")
              if len(data) >= 16 and data[1:4] == b"\r\r\n":
                  status, obj = _load_marshal(data[16:])
                  if status == "error":
                      sys.stderr.write(f"refusing unreadable bytecode: {name}\n")
                      sys.exit(1)
                  try:
                      hides = obj is not None and (
                          _payload_hides_secret(obj, set()) or _utf16_pairs(data)
                      )
                  except RecursionError:
                      sys.stderr.write(f"refusing unreadable bytecode: {name}\n")
                      sys.exit(1)
                  if hides:
                      sys.stderr.write(f"refusing secret text inside bytecode: {name}\n")
                      sys.exit(1)
              if utf16_text(data) and not cpython_bytecode(data, name):
                  sys.stderr.write(f"refusing UTF-16 text: {name}\n")
                  sys.exit(1)
              if b"\x00" not in data:
                  continue
              if ascii_after_nul(data) and not cpython_bytecode(data, name):
                  sys.stderr.write(f"refusing text hidden after a NUL byte: {name}\n")
                  sys.exit(1)
              if not known_binary(data):
                  sys.stderr.write(f"refusing NUL byte in text file: {name}\n")
                  sys.exit(1)
          PY
          )
          (
            cd "${scan}"
            gitleaks detect --redact --exit-code=2 \
              --config "${GITLEAKS_CONFIG}" \
              --gitleaks-ignore-path "${dest}" \
              --ignore-gitleaks-allow \
              --log-opts="--diff-merges=first-parent --text"
          )
