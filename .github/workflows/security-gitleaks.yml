name: Secret Scan (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/gitleaks-bin/gitleaks" version)" = "8.30.1"

      - name: Select the base gitleaks config
        id: gitleaks-config
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "${{ github.event.pull_request.base.sha }}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.base.toml"
            echo "path=$RUNNER_TEMP/gitleaks.base.toml" >> "$GITHUB_OUTPUT"
          else
            echo "path=.gitleaks.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ${{ steps.gitleaks-config.outputs.path }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      # The pinned action scans with --no-merges --first-parent, so a secret
      # that exists only in a merge commit is invisible to it. -m scans the
      # full base..head range, including those commits. The config is the
      # base revision's file, same as the action step above.
      - name: Scan every pull request commit
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(gitleaks version)" = "8.30.1"
          gitleaks detect --redact --exit-code=2 \
            --config "${{ steps.gitleaks-config.outputs.path }}" \
            --log-opts="-m ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gitleaks config regression
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest tests/test_gitleaks_config.py -v
